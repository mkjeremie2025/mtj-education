<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="MT Jeunesse - Cours et exercices">
<title>MT Jeunesse - Cours</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}
header{
  background:linear-gradient(135deg,#0759d6,#00a8ff);
  color:white;
  padding:20px;
  text-align:center;
}
header h1{margin:0}
.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}
.hero{
  background:white;
  padding:25px;
  border-radius:16px;
  margin-bottom:20px;
  text-align:center;
}
.search{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-top:15px;
  font-size:16px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}
.card,.note{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 3px 12px #0001;
  margin-bottom:15px;
}
.card h3,.note h3{margin-top:0}
button{
  border:0;
  background:#0759d6;
  color:white;
  padding:12px 18px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}
button:hover{background:#0345aa}
.back{background:#555;margin-bottom:15px}
.hidden{display:none}
.lesson{
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 3px 12px #0001;
}
.example,.formula,.exercise{
  padding:15px;
  margin:15px 0;
  border-radius:10px;
  background:#f1f5ff;
}
.answer{
  display:none;
  margin-top:10px;
  padding:10px;
  background:#e8f7e8;
  border-radius:8px;
}
footer{
  text-align:center;
  padding:25px;
  margin-top:30px;
  background:#172033;
  color:white;
}
</style>
</head>

<body>

<header>
  <h1>📚 MT Jeunesse</h1>
  <p>Apprendre aujourd'hui, construire demain</p>
</header>

<div class="container">

<section class="hero">
  <h2>Bienvenue sur MT Jeunesse</h2>
  <p>Choisis une matière pour découvrir ses cours.</p>

  <input
    class="search"
    id="recherche"
    placeholder="🔎 Rechercher une matière..."
    oninput="rechercher()">
</section>

<section id="matieres">
  <h2>📖 Matières</h2>
  <div class="grid" id="liste"></div>
</section>

<section id="cours" class="hidden">
  <button class="back" onclick="retourMatieres()">← Retour aux matières</button>
  <h2 id="titreMatiere"></h2>
  <div id="listeCours"></div>
</section>

<section id="note" class="hidden">
  <button class="back" onclick="retourCours()">← Retour aux cours</button>
  <div id="contenuNote"></div>
</section>

</div>

<footer>
  © 2026 MT Jeunesse — Apprendre, comprendre, réussir.
</footer>

<script>

const programme = {

"Mathématiques":[
{
titre:"Les fractions",
lecon:"Une fraction représente une partie d'un tout. Elle possède un numérateur et un dénominateur.",
exemple:"Exemple : 3/4 signifie trois parties sur quatre.",
formule:"Fraction = numérateur ÷ dénominateur",
exercices:[
["🟢 Débutant","Que représente 1/2 ?","Une moitié."],
["🔵 Amateur","Calcule 1/2 + 1/2.","1."],
["🟠 Difficile","Calcule 3/4 + 1/4.","1."],
["🔴 Expert","Explique pourquoi 2/4 = 1/2.","Parce que les deux fractions représentent la même quantité."]
]
},
{
titre:"Les équations",
lecon:"Une équation est une égalité contenant une inconnue, souvent représentée par x.",
exemple:"Exemple : x + 5 = 12. Donc x = 7.",
formule:"x + a = b  →  x = b - a",
exercices:[
["🟢 Débutant","Résous x + 3 = 8.","x = 5"],
["🔵 Amateur","Résous x - 4 = 10.","x = 14"],
["🟠 Difficile","Résous 2x = 18.","x = 9"],
["🔴 Expert","Résous 3x + 2 = 14.","x = 4"]
]
}
],

"Électricité":[
{
titre:"La loi d'Ohm",
lecon:"La loi d'Ohm relie la tension, la résistance et le courant dans un circuit électrique.",
exemple:"Si U = 12 V et R = 4 Ω, alors I = 12 ÷ 4 = 3 A.",
formule:"U = R × I\nI = U ÷ R\nR = U ÷ I",
exercices:[
["🟢 Débutant","Que signifie U ?","La tension électrique."],
["🔵 Amateur","Que signifie I ?","L'intensité du courant."],
["🟠 Difficile","U = 10 V et R = 5 Ω. Trouve I.","I = 2 A."],
["🔴 Expert","I = 3 A et R = 4 Ω. Trouve U.","U = 12 V."]
]
},
{
titre:"Le courant électrique",
lecon:"Le courant électrique correspond au déplacement des charges électriques dans un circuit fermé.",
exemple:"Une lampe s'allume lorsque le circuit est fermé.",
formule:"I = Q ÷ t",
exercices:[
["🟢 Débutant","Une lampe fonctionne-t-elle avec un circuit ouvert ?","Non."],
["🔵 Amateur","Quelle unité mesure l'intensité ?","L'ampère (A)."],
["🟠 Difficile","Quel appareil mesure le courant ?","L'ampèremètre."],
["🔴 Expert","Pourquoi faut-il un circuit fermé ?","Pour permettre la circulation du courant."]
]
}
],

"Anglais":[
{
titre:"Verb To Be",
lecon:"Le verbe To Be signifie principalement être. Au présent, on utilise am, is ou are.",
exemple:"I am a student. She is happy. They are ready.",
formule:"I am / You are / He is / She is / We are / They are",
exercices:[
["🟢 Débutant","Complète : I ___ a student.","am"],
["🔵 Amateur","Complète : She ___ happy.","is"],
["🟠 Difficile","Complète : They ___ students.","are"],
["🔴 Expert","Traduis : Nous sommes prêts.","We are ready."]
]
}
],

"Français":[
{
titre:"Les noms",
lecon:"Un nom désigne une personne, un animal, une chose ou une idée.",
exemple:"Paul, chien, maison et courage sont des noms.",
formule:"Nom = personne, animal, chose ou idée",
exercices:[
["🟢 Débutant","Trouve le nom : Le garçon court.","garçon"],
["🔵 Amateur","Trouve le nom : La maison est grande.","maison"],
["🟠 Difficile","Donne deux noms.","Exemple : école, livre."],
["🔴 Expert","Explique ce qu'est un nom.","Un mot qui désigne une personne, un animal, une chose ou une idée."]
]
}
],

"Histoire":[
{
titre:"Qu'est-ce que l'histoire ?",
lecon:"L'histoire étudie les événements du passé et les sociétés humaines.",
exemple:"Les grandes guerres, les royaumes et les indépendances font partie de l'histoire.",
formule:"Histoire = étude du passé",
exercices:[
["🟢 Débutant","Que représente l'histoire ?","L'étude du passé."],
["🔵 Amateur","L'histoire étudie-t-elle le futur ?","Non."],
["🟠 Difficile","Donne un exemple d'événement historique.","L'indépendance d'un pays."],
["🔴 Expert","Pourquoi étudier l'histoire ?","Pour comprendre le passé et mieux comprendre le présent."]
]
}
],

"Géographie":[
{
titre:"La Terre",
lecon:"La Terre est une planète du système solaire. Elle possède des continents et des océans.",
exemple:"L'Afrique est l'un des continents de la Terre.",
formule:"Terre = continents + océans",
exercices:[
["🟢 Débutant","Sur quelle planète vivons-nous ?","La Terre."],
["🔵 Amateur","Cite un continent.","L'Afrique."],
["🟠 Difficile","Cite un océan.","L'océan Atlantique."],
["🔴 Expert","Quelle est la différence entre un continent et un océan ?","Un continent est une grande étendue de terres ; un océan est une grande étendue d'eau."]
]
}
],

"Sciences":[
{
titre:"La matière",
lecon:"La matière est tout ce qui possède une masse et occupe un espace.",
exemple:"L'eau, le bois, le fer et l'air sont de la matière.",
formule:"Matière → solide, liquide ou gaz",
exercices:[
["🟢 Débutant","Cite un solide.","Le bois."],
["🔵 Amateur","Cite un liquide.","L'eau."],
["🟠 Difficile","Cite un gaz.","L'air."],
["🔴 Expert","Quels sont les trois états courants de la matière ?","Solide, liquide et gaz."]
]
}
],

"Entrepreneuriat":[
{
titre:"L'idée d'entreprise",
lecon:"Une idée d'entreprise correspond à une solution ou un produit que l'on souhaite proposer à des clients.",
exemple:"Vendre des accessoires scolaires peut être une idée d'entreprise.",
formule:"Idée + besoin + clients = opportunité",
exercices:[
["🟢 Débutant","Qu'est-ce qu'une idée d'entreprise ?","Une idée permettant de proposer un produit ou un service."],
["🔵 Amateur","Pourquoi connaître ses clients ?","Pour répondre à leurs besoins."],
["🟠 Difficile","Donne une idée d'entreprise.","Exemple : vente d'accessoires scolaires."],
["🔴 Expert","Pourquoi étudier le marché ?","Pour connaître les clients et la concurrence."]
]
}
],

"Gouvernement":[
{
titre:"Le citoyen",
lecon:"Un citoyen est une personne qui appartient à une communauté politique et possède des droits et des devoirs.",
exemple:"Respecter les lois fait partie des responsabilités du citoyen.",
formule:"Citoyen = droits + devoirs",
exercices:[
["🟢 Débutant","Qu'est-ce qu'un citoyen ?","Une personne appartenant à une communauté politique."],
["🔵 Amateur","Cite un devoir.","Respecter les lois."],
["🟠 Difficile","Cite un droit.","Le droit à l'éducation."],
["🔴 Expert","Pourquoi respecter les autres citoyens ?","Pour favoriser la vie en société."]
]
}
],

"Informatique":[
{
titre:"L'ordinateur",
lecon:"Un ordinateur est une machine électronique capable de recevoir, traiter, stocker et restituer des informations.",
exemple:"Le clavier permet d'entrer des informations et l'écran permet de les afficher.",
formule:"Entrée → Traitement → Sortie",
exercices:[
["🟢 Débutant","Qu'est-ce qu'un ordinateur ?","Une machine électronique qui traite des informations."],
["🔵 Amateur","Cite un périphérique d'entrée.","Le clavier."],
["🟠 Difficile","Cite un périphérique de sortie.","L'écran."],
["🔴 Expert","Que signifie traitement de l'information ?","L'ordinateur transforme les données reçues en résultats."]
]
},
{
titre:"Internet",
lecon:"Internet est un réseau mondial qui permet à des appareils de communiquer et d'échanger des informations.",
exemple:"Le Web, les e-mails et les services de messagerie utilisent Internet.",
formule:"Internet = réseau mondial",
exercices:[
["🟢 Débutant","Qu'est-ce qu'Internet ?","Un réseau mondial d'appareils connectés."],
["🔵 Amateur","Cite un service utilisant Internet.","Le courrier électronique."],
["🟠 Difficile","Internet est-il un seul ordinateur ?","Non, c'est un réseau de nombreux appareils."],
["🔴 Expert","Pourquoi utilise-t-on Internet ?","Pour communiquer, rechercher et échanger des informations."]
]
}
]

};

let matiereActuelle="";
let coursActuels=[];

function afficherMatieres(){
  const liste=document.getElementById("liste");
  liste.innerHTML="";

  Object.keys(programme).forEach(function(matiere){
    liste.innerHTML+=`
      <div class="card">
        <h3>📘 ${matiere}</h3>
        <p>${programme[matiere].length} cours disponibles</p>
        <button onclick="ouvrirMatiere('${matiere}')">
          Voir les cours
        </button>
      </div>
    `;
  });
}

function ouvrirMatiere(matiere){
  matiereActuelle=matiere;
  coursActuels=programme[matiere];

  document.getElementById("matieres").classList.add("hidden");
  document.getElementById("cours").classList.remove("hidden");

  document.getElementById("titreMatiere").textContent="📖 "+matiere;

  const liste=document.getElementById("listeCours");
  liste.innerHTML="";

  coursActuels.forEach(function(cours,index){
    liste.innerHTML+=`
      <div class="note">
        <h3>${index+1}. ${cours.titre}</h3>
        <p>${cours.lecon}</p>
        <button onclick="ouvrirNote(${index})">
          📚 Lire la note
        </button>
      </div>
    `;
  });

  window.scrollTo(0,0);
}

function ouvrirNote(index){
  const cours=coursActuels[index];

  document.getElementById("cours").classList.add("hidden");
  document.getElementById("note").classList.remove("hidden");

  let html=`
    <div class="lesson">
      <h2>📖 ${cours.titre}</h2>

      <h3>📝 Leçon</h3>
      <p>${cours.lecon}</p>

      <div class="example">
        <h3>💡 Exemple</h3>
        <p>${cours.exemple}</p>
      </div>

      <div class="formula">
        <h3>📐 Formule / À retenir</h3>
        <p>${cours.formule.replace(/\n/g,"<br>")}</p>
      </div>

      <h3>✏️ Exercices</h3>
  `;

  cours.exercices.forEach(function(exercice,indexExercice){
    html+=`
      <div class="exercise">
        <strong>${exercice[0]}</strong>
        <p><b>Question :</b> ${exercice[1]}</p>

        <button onclick="voirReponse(${indexExercice})">
          Voir la correction
        </button>

        <div class="answer" id="reponse${indexExercice}">
          <b>Correction :</b> ${exercice[2]}
        </div>
      </div>
    `;
  });

  html+=`</div>`;

  document.getElementById("contenuNote").innerHTML=html;
  window.scrollTo(0,0);
}

function voirReponse(index){
  const reponse=document.getElementById("reponse"+index);

  if(reponse.style.display==="block"){
    reponse.style.display="none";
  }else{
    reponse.style.display="block";
  }
}

function retourMatieres(){
  document.getElementById("cours").classList.add("hidden");
  document.getElementById("note").classList.add("hidden");
  document.getElementById("matieres").classList.remove("hidden");
  window.scrollTo(0,0);
}

function retourCours(){
  document.getElementById("note").classList.add("hidden");
  document.getElementById("cours").classList.remove("hidden");
  window.scrollTo(0,0);
}

function rechercher(){
  const recherche=document.getElementById("recherche").value.toLowerCase();

  document.querySelectorAll("#liste .card").forEach(function(card){
    card.style.display=
      card.innerText.toLowerCase().includes(recherche)
      ? "block"
      : "none";
  });
}

afficherMatieres();

</script>

</body>
</html>
